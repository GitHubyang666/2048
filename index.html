<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #faf8ef;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; user-select: none;
}
.container { text-align: center; }
h1 { font-size: 48px; color: #776e65; margin-bottom: 12px; }
.score-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
.score-box {
    background: #bbada0; color: #fff; padding: 8px 20px;
    border-radius: 6px; font-size: 14px; font-weight: bold;
}
.score-box span { display: block; font-size: 22px; }
#board {
    display: inline-grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px;
}
.cell {
    width: 80px; height: 80px; display: flex;
    align-items: center; justify-content: center;
    font-size: 28px; font-weight: bold; color: #776e65;
    background: #cdc1b4; border-radius: 4px;
    transition: background 0.1s, transform 0.1s;
}
.cell-2   { background:#eee4da; }
.cell-4   { background:#ede0c8; }
.cell-8   { background:#f2b179; color:#f9f6f2; }
.cell-16  { background:#f59563; color:#f9f6f2; }
.cell-32  { background:#f67c5f; color:#f9f6f2; }
.cell-64  { background:#f65e3b; color:#f9f6f2; }
.cell-128 { background:#edcf72; font-size:24px; }
.cell-256 { background:#edcc61; font-size:24px; }
.cell-512 { background:#edc850; font-size:24px; }
.cell-1024{ background:#edc53f; font-size:20px; }
.cell-2048{ background:#edc22e; font-size:20px; }
.cell-super { background:#3c3a32; color:#f9f6f2; font-size:18px; }
.btn-row { margin-top: 16px; }
.btn {
    background: #8f7a66; color: #f9f6f2; border: none;
    padding: 10px 24px; border-radius: 4px; font-size: 16px;
    font-weight: bold; cursor: pointer;
}
.btn:hover { background: #9f8b76; }
.msg { margin-top: 10px; font-size: 16px; color: #776e65; }
</style>
</head>
<body>
<div class="container">
    <h1>2048</h1>
    <div class="score-bar">
        <div class="score-box">分数<span id="score">0</span></div>
        <div class="score-box">最高<span id="best">0</span></div>
    </div>
    <div id="board"></div>
    <div class="btn-row">
        <button class="btn" id="restart">再来一局</button>
    </div>
    <div class="msg" id="msg"></div>
</div>

<script>
let grid = Array.from({length:4}, ()=>Array(4).fill(0));
let score = 0, best = 0;
const boardEl = document.getElementById('board');

function init() {
    grid = Array.from({length:4}, ()=>Array(4).fill(0));
    score = 0; best = best || 0;
    scoreEl.textContent = 0; bestEl.textContent = best;
    msgEl.textContent = '';
    addRandom(); addRandom(); render();
}

function emptyCells() {
    let cells = [];
    for (let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) cells.push([r,c]);
    return cells;
}

function addRandom() {
    let cells = emptyCells();
    if(!cells.length) return;
    let [r,c] = cells[Math.floor(Math.random()*cells.length)];
    grid[r][c] = Math.random()<0.9?2:4;
}

function render() {
    boardEl.innerHTML = '';
    for (let r=0;r<4;r++) {
        for (let c=0;c<4;c++) {
            let v = grid[r][c];
            let div = document.createElement('div');
            div.className = 'cell';
            if(v) {
                div.textContent = v;
                if(v<=2048) div.classList.add('cell-'+v); else div.classList.add('cell-super');
            }
            boardEl.appendChild(div);
        }
    }
}

function slide(row) {
    let a = row.filter(x=>x);
    let merged = [];
    for(let i=0;i<a.length;i++){
        if(i+1<a.length && a[i]===a[i+1]){
            merged.push(a[i]*2);
            score += a[i]*2;
            i++;
        } else merged.push(a[i]);
    }
    while(merged.length<4) merged.push(0);
    return merged;
}

function move(dir) {
    let moved = false;
    for(let i=0;i<4;i++) {
        let row = [grid[i][0],grid[i][1],grid[i][2],grid[i][3]];
        let orig = [...row];
        if(dir==='left') row = slide(row);
        else if(dir==='right') row = slide(row.reverse()).reverse();
        else if(dir==='up') row = slide([grid[0][i],grid[1][i],grid[2][i],grid[3][i]]);
        else if(dir==='down') row = slide([grid[3][i],grid[2][i],grid[1][i],grid[0][i]]).reverse();
        
        if(dir==='left') for(let j=0;j<4;j++) grid[i][j]=row[j];
        else if(dir==='right') for(let j=0;j<4;j++) grid[i][j]=row[j];
        else if(dir==='up') for(let j=0;j<4;j++) grid[j][i]=row[j];
        else if(dir==='down') for(let j=0;j<4;j++) grid[j][i]=row[j];
        
        if(orig.join(',')!==grid[i].slice().join(',')) moved=true;
    }
    if(moved) {
        addRandom();
        if(score>best) { best=score; bestEl.textContent=best; }
        scoreEl.textContent=score;
        render();
        if(!canMove()) {
            let win = grid.flat().some(v=>v>=2048);
            msgEl.textContent = win ? '你赢了！点击"再来一局"重新开始' : '游戏结束！点击"再来一局"重新开始';
        }
    }
}

function canMove() {
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
        if(!grid[r][c]) return true;
        if(c<3 && grid[r][c]===grid[r][c+1]) return true;
        if(r<3 && grid[r][c]===grid[r+1][c]) return true;
    }
    return false;
}

document.addEventListener('keydown', e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
        e.preventDefault();
        move(e.key.replace('Arrow',''));
    }
});

document.getElementById('restart').onclick = init;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

init();
</script>
</body>
</html>
